services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      APP_NAME: QueryPilot
      APPLICATION_DATABASE_URL: postgresql+psycopg://querypilot_app:querypilot_app@postgres:5432/querypilot
      GENERATED_QUERY_DATABASE_URL: postgresql+psycopg://querypilot_reader:querypilot_reader@postgres:5432/querypilot
      GENERATED_QUERY_TIMEOUT_MS: 5000
      GENERATED_QUERY_MAX_ROWS: 200
      QUERY_PROVIDER: demo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: querypilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d querypilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-querypilot-roles.sql:ro

volumes:
  postgres_data:
